name: Retry Java release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose Java SDK failed to publish (e.g. v0.2.0)
        required: true
        type: string

permissions:
  contents: read

# Serialize recovery with the normal release for the same tag.
concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      release_tag: ${{ steps.resolve.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Resolve the original release source
        id: resolve
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          # Java recovery runs current workflows against the original tagged source.
          # npm/PyPI keep their stricter workflow/source identity in Release SDKs.
          RELEASE_COMMIT: ""
        run: node tools/codegen/src/release.ts

  checks:
    needs: release
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.release.outputs.ref }}
      release_tag: ${{ needs.release.outputs.release_tag }}

  publish-java:
    needs: [release, checks]
    uses: ./.github/workflows/release-java.yml
    with:
      ref: ${{ needs.release.outputs.ref }}
    secrets:
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
