name: SDK checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:
    inputs:
      ref:
        description: Resolved release commit to check
        type: string
        default: ""
      release_tag:
        description: Release tag to validate and produce publishable artifacts for
        type: string
        default: ""
    secrets:
      ATEVE_API_KEY:
        description: API key for required live contract checks on trusted runs
        required: false

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "24"
            python: "3.11"
            java: "11"
          - node: "24"
            python: "3.14"
            java: "17"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: packages/java/pom.xml
      - run: pnpm install --frozen-lockfile
      - run: pnpm bootstrap
        env:
          UV_PYTHON: ${{ matrix.python }}
      - name: Check SDKs and the selected release tag
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            export GITHUB_REF_TYPE=tag GITHUB_REF_NAME="$RELEASE_TAG"
          fi
          pnpm check
        env:
          UV_PYTHON: ${{ matrix.python }}
      - run: pnpm --filter @ateve/js pack --pack-destination /tmp/ateve-pack
      - name: Check package contents and load packaged SDKs
        run: node tools/codegen/src/check-artifacts.ts /tmp/ateve-pack
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code
      - name: Upload the verified npm tarball
        if: inputs.release_tag != '' && matrix.java == '11'
        uses: actions/upload-artifact@v4
        with:
          name: npm-sdk
          path: /tmp/ateve-pack/ateve-*.tgz
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Upload the verified Python distributions
        if: inputs.release_tag != '' && matrix.java == '11'
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: |
            packages/python/dist/*.whl
            packages/python/dist/*.tar.gz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  live-api:
    name: Live API contract
    needs: checks
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate real requests and responses against the shared contract
        env:
          ATEVE_API_KEY: ${{ secrets.ATEVE_API_KEY }}
        run: pnpm --filter @ateve/contract live:check
