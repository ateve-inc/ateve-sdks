name: SDK checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "24"
            python: "3.11"
            java: "11"
          - node: "24"
            python: "3.14"
            java: "17"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: packages/java/pom.xml
      - run: pnpm install --frozen-lockfile
      - run: pnpm bootstrap
        env:
          UV_PYTHON: ${{ matrix.python }}
      - run: pnpm check
        env:
          UV_PYTHON: ${{ matrix.python }}
      - run: pnpm --filter @ateve/js pack --pack-destination /tmp/ateve-pack
      - name: Check package contents and load packaged SDKs
        run: node tools/codegen/src/check-artifacts.ts /tmp/ateve-pack
      - name: Verify checks did not modify tracked files
        run: git diff --exit-code
