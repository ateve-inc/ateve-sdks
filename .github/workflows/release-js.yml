name: Publish JavaScript SDK

on:
  workflow_call:
    inputs:
      dist_tag:
        description: npm distribution tag selected from the checked release version
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          name: npm-sdk
          path: /tmp/ateve-release
      - name: Publish the verified tarball with npm OIDC
        env:
          NPM_DIST_TAG: ${{ inputs.dist_tag }}
        run: npm publish /tmp/ateve-release/ateve-*.tgz --access public --provenance --tag "$NPM_DIST_TAG"
